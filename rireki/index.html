<body>
<noscript><p style="padding:20px">Rireki Studio needs JavaScript. You can still read the <a href="guide.html">guide in English</a> or <a href="guide-ja.html">日本語のガイド</a>.</p></noscript>
<div class="kbg" aria-hidden="true">
  <span style="left:2%;top:12%;font-size:120px">履</span><span style="left:46%;top:58%;font-size:180px">道</span>
  <span style="right:3%;top:20%;font-size:140px">夢</span><span style="left:20%;bottom:-4%;font-size:110px">職</span>
  <span style="right:16%;bottom:6%;font-size:90px">日本</span>
</div>

<div class="app">
  <header class="top"><div class="top-in">
    <div class="brand"><div class="mon" aria-hidden="true">履</div><div class="nm">Rireki <b>Studio</b><small>履歴書・職務経歴書</small></div></div>
    <nav class="views" aria-label="Views">
      <button type="button" id="v-builder" data-goview="builder" data-t="nav_builder"></button>
      <button type="button" id="v-guide" data-goview="guide" data-t="nav_guide"></button>
    </nav>
    <div class="acts">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en">EN</button><button type="button" id="lang-ja" data-lang="ja">日本語</button>
      </div>
      <button class="btn" type="button" id="btn-cvs"><span class="cvname" id="cvname"></span><span class="chev">▼</span></button>
      <button class="btn red" type="button" id="btn-pdf" data-t="btn_pdf"></button>
    </div>
  </div></header>

  <div id="builder">
    <div class="viewswitch"><div class="seg" role="group">
      <button type="button" id="pn-edit" data-pane="edit" data-t="view_edit"></button>
      <button type="button" id="pn-prev" data-pane="preview" data-t="view_preview"></button>
    </div></div>
    <div class="main">
      <section class="editor" aria-label="Editor">
        <nav class="stabs" role="tablist" id="stabs"></nav>
        <div class="form" id="form"></div>
      </section>
      <section class="preview" aria-label="Preview">
        <div class="ptabs">
          <div class="seg" role="group" id="dtabs">
            <button type="button" id="dt-rireki" data-doc="rireki">履歴書</button>
            <button type="button" id="dt-shokumu" data-doc="shokumu">職務経歴書</button>
            <button type="button" id="dt-check" data-doc="check"><span data-t="d_check"></span><span class="badge" id="ckbadge">0</span></button>
          </div>
        </div>
        <div class="docwrap" id="docwrap"></div>
      </section>
    </div>
  </div>

  <div id="guide" hidden></div>
</div>

<dialog id="dlg-cvs">
  <h2><span data-t="cvs_title"></span><span class="jp">マイ履歴書</span></h2>
  <p class="hint" data-t="cvs_hint"></p>
  <div class="cvlist" id="cvlist"></div>
  <div class="dlg-acts" style="justify-content:flex-start">
    <button class="btn" type="button" id="cv-new" data-t="cv_new"></button>
    <button class="btn" type="button" id="cv-example" data-t="cv_example"></button>
    <button class="btn" type="button" id="cv-io" data-t="btn_io"></button>
    <button class="btn ghost" type="button" id="cv-close" style="margin-left:auto" data-t="close"></button>
  </div>
</dialog>

<dialog id="dlg-io">
  <h2><span data-t="io_title"></span><span class="jp">読込・書出</span></h2>
  <p class="hint" data-t="io_hint"></p>
  <div class="dlg-acts" style="justify-content:flex-start;margin:10px 0">
    <label class="btn"><span data-t="io_file"></span><input type="file" id="io-file" accept=".json,application/json" hidden></label>
    <button class="btn" type="button" id="io-save-one" data-t="io_save_one"></button>
    <button class="btn" type="button" id="io-save-all" data-t="io_save_all"></button>
  </div>
  <details class="adv"><summary data-t="io_text"></summary>
    <p class="hint" data-t="io_text_hint"></p>
    <textarea id="io-text" spellcheck="false"></textarea>
    <div class="dlg-acts">
      <button class="btn" type="button" id="io-copy" data-t="io_copy"></button>
      <button class="btn" type="button" id="io-load" data-t="io_load"></button>
    </div>
  </details>
  <div class="dlg-acts"><button class="btn ghost" type="button" id="io-close" data-t="close"></button></div>
</dialog>

<div id="measure"></div>
<div id="capture"></div>
<div id="printRoot"></div>
<footer class="foot"><span>Rireki Studio · made by <a href="/">Tommy Slettvold</a> <span lang="ja">平原 智明</span></span>
  <span>No account, no tracking: your CVs stay in this browser. Use Import / Export for backups.</span>
  <a href="guide.html">Guide (EN)</a><a href="guide-ja.html" lang="ja">ガイド（日本語）</a><a href="/contact/?about=idea">Feedback</a></footer>
</body>
</html>
